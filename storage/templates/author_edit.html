
<div>
  <h1>Edit Profile for {{author_name}}</h1>
  <textarea id="profile-content" name="content" rows="10">{{profile_content}}</textarea>
  <button id="saveButton" disabled>Save Profile</button>
</div>

<script>
  document.addEventListener("accountChangedEvent", (e) => {
    // Enable the button only if a wallet is connected
    document.getElementById("saveButton").disabled = !e.detail.keplrAccount;
  });

  document.getElementById("saveButton").addEventListener("click", () => {
    const content = document.getElementById("profile-content").value;
    const author = "{{author_name}}";

    runFunction({
      functionName: "edit_author_profile",
      kwargs: { content: content, author: author },
      gasLimit: 20000000, // Set an appropriate gas limit
    })
    .then((result) => {
        alert("Profile updated successfully!");
        // Optionally, redirect to the author's page
        window.location.href = "/authors/" + author;
    })
    .catch((e) => {
        console.error("Error updating profile:", e);
        alert("Failed to update profile: " + e.message);
    });
  });
</script>
