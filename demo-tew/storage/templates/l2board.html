<div x-data="l2Board" class="space-y-6">
    <h2 class="text-2xl font-bold">L2 State - Round <span x-text="round"></span></h2>
    
    <!-- Status Card -->
    <div class="card bg-base-200 shadow-xl">
        <div class="card-body">
            <h3 class="card-title">Chain Status</h3>
            <div class="stats stats-vertical lg:stats-horizontal shadow">
                <div class="stat">
                    <div class="stat-figure text-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-8 h-8 stroke-current"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <div class="stat-title">Current Round</div>
                    <div class="stat-value text-primary" x-text="round"></div>
                </div>
                
                <div class="stat">
                    <div class="stat-figure text-secondary">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-8 h-8 stroke-current"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <div class="stat-title">Latest Round</div>
                    <div class="stat-value text-secondary" x-text="latestRound"></div>
                </div>
                
                <div class="stat">
                    <div class="stat-figure">
                        <button @click="refreshState" class="btn btn-sm btn-outline">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                        </button>
                    </div>
                    <div class="stat-title">Status</div>
                    <div class="stat-value text-sm" x-text="loading ? 'Loading...' : 'Active'"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Messages Display -->
    <div class="card bg-base-200 shadow-xl">
        <div class="card-body">
            <h3 class="card-title">L2 Messages</h3>
            
            <template x-if="Object.keys(state).length === 0">
                <div class="alert alert-info">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>No messages in the L2 state yet. Messages will appear here once submitted through the L2 protocol.</span>
                </div>
            </template>
            
            <template x-if="Object.keys(state).length > 0">
                <div class="space-y-4">
                    <template x-for="[author, messages] in Object.entries(state)" :key="author">
                        <div class="collapse collapse-arrow bg-base-100">
                            <input type="checkbox" checked /> 
                            <div class="collapse-title text-xl font-medium">
                                Messages from: <code class="text-sm" x-text="author"></code>
                            </div>
                            <div class="collapse-content"> 
                                <template x-for="(msg, index) in messages" :key="index">
                                    <div class="chat chat-start">
                                        <div class="chat-bubble" x-text="msg"></div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>
    
    <!-- Auto-refresh indicator -->
    <div class="text-center text-sm opacity-70">
        <span x-show="!loading">Auto-refreshing every 5 seconds</span>
        <span x-show="loading" class="loading loading-spinner loading-sm"></span>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('l2Board', () => ({
        round: {{ round }},
        latestRound: {{ latest_round }},
        state: {{ state_json }},
        loading: false,
        
        init() {
            // Auto-refresh every 5 seconds
            setInterval(() => this.refreshState(), 5000);
        },
        
        async refreshState() {
            this.loading = true;
            try {
                const response = await fetch('/api/state');
                const data = await response.json();
                this.round = data.round;
                this.state = data.state;
                
                // Also update latest round
                const headResponse = await fetch('/api/head');
                const headData = await headResponse.json();
                this.latestRound = headData.latest_round;
            } catch (error) {
                console.error('Error refreshing state:', error);
            } finally {
                this.loading = false;
            }
        }
    }));
});
</script>
