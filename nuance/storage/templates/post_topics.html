
<style>
  input.invalid {
    border: 2px solid #ff4444 !important;
    background-color: #fff5f5 !important;
  }
  
  .validation-error {
    color: #d32f2f;
    font-size: 0.9em;
    margin-top: 4px;
    display: block;
  }
</style>

<div>
  <h2><a href="/{{post_id}}"> Post #{{post_id}}</a> tags</h2>

  <fieldset x-data="createPostTopicsData({{post_id}})">
    <span>Note: Only the author of this post can add tags.</span>
    <legend>Add tag</legend>
    
    <!-- Error display -->
    <div x-show="error" class="error" style="color: red; background: #ffebee; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #ffcdd2;">
      <strong>Error:</strong> <span x-text="error"></span>
    </div>
    
    <div>
      <label for="tagName">Topic name *</label>
      <input name="tagName" x-model="tagName" :class="{'invalid': tagName !== '' && !tagName.trim()}" />
      <div x-show="tagName !== '' && !tagName.trim()" class="validation-error" style="color: red; font-size: 0.9em; margin-top: 4px;">
        Topic name is required
      </div>
    </div>
    <div>
      <label for="amount">Amount in DYS</label>
      <input name="amount" type="number" x-model="amount" :class="{'invalid': amount !== '' && amount !== null && amount !== undefined && (isNaN(parseFloat(amount)) || parseFloat(amount) < 0)}" />
      <div x-show="amount !== '' && amount !== null && amount !== undefined && (isNaN(parseFloat(amount)) || parseFloat(amount) < 0)" class="validation-error" style="color: red; font-size: 0.9em; margin-top: 4px;">
        Amount must be a positive number
      </div>
    </div>
    <div>
      <label for="name">(optional) Dys Name</label>
      <input name="name"  x-model="contributor" />
    </div>
    <p>
      <button
        type="button"
        class="addBtn"
        :disabled="!$store.walletStore.activeWalletMeta || isSubmitting || !isFormValid"
        @click="addTag()"
      >
        <span x-show="!isSubmitting">Add tag</span>
        <span x-show="isSubmitting">Adding...</span>
      </button>
    </p>
  </fieldset>
  
  <ol>
    {{items_html}}
    {{load_more_html}}
  </ol>
</div>
