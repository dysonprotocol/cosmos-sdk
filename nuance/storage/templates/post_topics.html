<div class="mx-auto p-y6 space-y-8" x-data="createPostTopicsData({{post_id}})">
  <!-- Header -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">
      <a href="/{{post_id}}" class="text-blue-600 hover:text-blue-800 transition-colors">
        Post #{{post_id}}
      </a> 
      Tags
    </h1>
  </div>

  <!-- Add Tag Form -->
  <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">
    <!-- Note -->
    <div class="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-md">
      <p class="text-sm text-blue-800">
        <strong>Note:</strong> Only the author of this post can add tags.
      </p>
    </div>
    
    <h2 class="text-lg font-semibold text-gray-900 mb-6">Add Tag</h2>
    
    <!-- Error display -->
    <div x-show="error" class="mb-4 p-4 bg-red-50 border border-red-200 rounded-md">
      <div class="flex items-center">
        <svg class="w-5 h-5 text-red-400 mr-2" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
        </svg>
        <div>
          <strong class="text-red-800">Error:</strong> 
          <span class="text-red-700" x-text="error"></span>
        </div>
      </div>
    </div>
    
    <form class="space-y-6">
      <!-- Topic Name Field -->
      <div>
        <label for="tagName" class="block text-sm font-medium text-gray-700 mb-2">
          Topic name <span class="text-red-500">*</span>
        </label>
        <input 
          id="tagName"
          name="tagName" 
          type="text"
          x-model="tagName" 
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          :class="{'border-red-300 focus:ring-red-500 focus:border-red-500': tagName !== '' && !tagName.trim()}"
          placeholder="Enter topic name"
        />
        <div x-show="tagName !== '' && !tagName.trim()" class="mt-1 text-sm text-red-600">
          Topic name is required
        </div>
      </div>
      
      <!-- Hidden Contributor Field -->
      <input 
        id="contributor"
        name="contributor" 
        type="hidden"
        :value="currentAuthor"
      />
      
      <!-- Submit Button -->
      <div class="pt-4">
        <button
          type="button"
          class="w-full px-4 py-2 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
          :disabled="!$store.walletStore.activeWalletMeta || isSubmitting || !isFormValid"
          @click="addTag()"
        >
          <span x-show="!isSubmitting">Add Tag</span>
          <span x-show="isSubmitting" class="flex items-center justify-center">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Adding...
          </span>
        </button>
      </div>
    </form>
  </div>
  
  <!-- Current Tags Section -->
  <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">
    <h2 class="text-lg font-semibold text-gray-900 mb-4">Current Tags</h2>
    <ol class="space-y-2">
      {{items_html}}
      {{load_more_html}}
    </ol>
  </div>
</div>
