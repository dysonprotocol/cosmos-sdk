<div>
  <h1>Edit Profile</h1>
  <div x-show="$store.walletStore.isWalletConnected()">
    <p><strong>Editing as:</strong> <span x-text="$store.walletStore.getAuthorIdentity()"></span></p>
  </div>
  <div x-show="!$store.walletStore.isWalletConnected()" style="color: red;">
    <p>Please connect your wallet to edit your profile.</p>
  </div>
  <textarea id="profile-content" name="content" rows="10" :disabled="!$store.walletStore.isWalletConnected()">{{content}}</textarea>
  <button id="saveButton" :disabled="$store.walletStore.isLoading || !$store.walletStore.isWalletConnected()">Save Profile</button>
</div>

<!-- Hidden data element for JavaScript to access -->
<script type="application/json" id="custom-pages-data">{{custom_pages}}</script>

<div x-data="customPagesManager()" x-init="init()">
  <h2>Custom Pages</h2>
  
  <!-- Custom Pages List -->
  <div id="custom-pages-list">
    <template x-for="page in pages" :key="page.path">
      <div class="custom-page-item" style="border: 1px solid #ddd; padding: 10px; margin: 5px 0;">
        <strong x-text="page.title"></strong>
        <span> (/<span x-text="page.path"></span>) - Post ID: <span x-text="page.post_id"></span></span>
        <button 
          @click="removePage(page.path)" 
          :disabled="$store.walletStore.isLoading || !$store.walletStore.isWalletConnected()"
          style="margin-left: 10px; background: #dc3545; color: white; border: none; padding: 2px 8px;">
          Remove
        </button>
      </div>
    </template>
    
    <div x-show="pages.length === 0" style="color: #666; font-style: italic;">
      No custom pages yet.
    </div>
  </div>
  
  <h3>Add New Custom Page</h3>
  <div>
    <input 
      type="text" 
      x-model="newPage.path" 
      placeholder="Path (e.g., 'about', 'contact')" 
      maxlength="50">
    <input 
      type="text" 
      x-model="newPage.title" 
      placeholder="Page Title" 
      maxlength="100">
    <input 
      type="number" 
      x-model.number="newPage.postId" 
      placeholder="Post ID" 
      min="1">
    <button 
      @click="addPage()" 
      :disabled="$store.walletStore.isLoading || !$store.walletStore.isWalletConnected() || !canAddPage">
      Add Page
    </button>
  </div>
  
  <!-- Error/Success Messages -->
  <div x-show="message" :class="messageType === 'error' ? 'error-message' : 'success-message'" style="margin-top: 10px; padding: 10px;">
    <span x-text="message"></span>
  </div>
</div>

<script type="module">
  // Import the author pages functionality
  import { customPagesManager, initProfileEditor } from '/static/js/authorPages.js';
  
  // Make customPagesManager available globally for Alpine.js
  window.customPagesManager = customPagesManager;
  
  // Initialize profile editor functionality
  initProfileEditor();
</script> 

<style>
  .error-message {
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
    border-radius: 4px;
  }
  
  .success-message {
    background-color: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
    border-radius: 4px;
  }
  
  .custom-page-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
</style>
