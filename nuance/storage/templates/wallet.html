<div class="" id="wallet-page-container">
  <section x-data="{
    // Local status messages for each section
    keplrStatus: '',
    importStatus: '',
    walletStatuses: {}, // indexed by wallet name
    
    // ephemeral data for local wallet import
    walletName: '',
    password: '',
    mnemonic: '',
    mnemonicSaved: false,
  
    // ephemeral pass storage for each existing local wallet
    // so that each wallet can be unlocked individually
    // (indexed by wallet name)
    passes: {},

    init() {
      console.log('wallet page init');
    },
  
    clearKeplrStatus() {
      this.keplrStatus = '';
    },
    
    clearImportStatus() {
      this.importStatus = '';
    },
    
    clearWalletStatus(walletName) {
      delete this.walletStatuses[walletName];
    },
  
    async connectExtensionKeplr() {
      this.keplrStatus = 'Connecting Keplr...';
      try {
        await $store.walletStore.connectExtension('keplr');
        this.keplrStatus = 'Connected via Keplr';
      } catch (e) {
        this.keplrStatus = 'Connect error: ' + (e.message || e);
      }
    },
  
    async importCosmJsWallet() {
      this.importStatus = 'Importing wallet...';
      try {
        await $store.walletStore.importNamedCosmJsWallet(this.walletName, this.mnemonic, this.password);
        this.walletName = '';
        this.password = '';
        this.mnemonic = '';
        this.mnemonicSaved = false;
        this.importStatus = 'Wallet imported successfully';
      } catch (e) {
        this.importStatus = 'Error: ' + e.message;
      }
    },
  
    async generateMnemonic12() {
      this.mnemonic = await $store.walletStore.generateMnemonic(12);
      this.clearImportStatus();
    },
  
    async generateMnemonic24() {
      this.mnemonic = await $store.walletStore.generateMnemonic(24);
      this.clearImportStatus();
    },
  
    async connectLocalWallet(name) {
      const pass = this.passes[name] || '';
      if (!pass) {
        this.walletStatuses[name] = 'Password required to connect local wallet.';
        return;
      }
      
      this.walletStatuses[name] = 'Connecting...';
      try {
        await $store.walletStore.connectNamedCosmJsWallet(name, pass);
        this.walletStatuses[name] = `Connected to local wallet '${name}'`;
      } catch (e) {
        this.walletStatuses[name] = 'Error: ' + e.message;
      }
    },
  
    async disconnectLocalWallet(name) {
      $store.walletStore.disconnectWallet();
      this.walletStatuses[name] = `Disconnected wallet '${name}'`;
    },
  
    async removeLocalWallet(name) {
      if (!confirm(`Remove wallet [${name}]? This cannot be undone.`)) return;
      try {
        $store.walletStore.removeNamedCosmJsWallet(name);
        this.walletStatuses[name] = `Removed local wallet '${name}'`;
      } catch (e) {
        this.walletStatuses[name] = 'Error: ' + e.message;
      }
    },
  }" id="wallet-page" class="space-y-8">
    <!-- Extension Wallets Section -->
     <h2 class="text-5xl text-center text-foreground  py-6">Wallet Management</h2>
    <div class="">

    <h2 class="text-xl font-semibold text-foreground">Use Browser Extension</h2> 
        
    <div class="bg-card border border-border shadow-lg">
      <div class="p-6">
        
        <!-- Keplr Status Message -->
        <div x-show="keplrStatus" 
             :class="keplrStatus.includes('error') || keplrStatus.includes('Error') ? 'alert-destructive' : 'alert'"
             class="mb-4">
          <section x-text="keplrStatus"></section>
        </div>
        
        <!-- Keplr Button -->
        <button
          id="connect-keplr-btn"
          :disabled="!window.keplr || $store.walletStore.activeWalletMeta?.type == 'keplr'"
          @click="connectExtensionKeplr()"
          class="btn"
        >
          Connect with Keplr
        </button>
        <div x-show="!window.keplr" class="bg-yellow-50 border border-yellow-200 text-yellow-800 p-3 rounded-md mt-4">
          <span>Keplr extension not found. Install and enable it first.</span>
        </div>
      </div>
    </div>
    </div>
  
    <!-- Imported Wallets Section -->
      <div class="">
        <h2 class="text-xl font-semibold text-foreground ">Imported CosmJs Wallets</h2>
        
        <div x-show="$store.walletStore.localCosmJsWallets.length === 0" class="text-center py-8 shadow-lg">
          <p class="text-muted-foreground">No local wallets found. Import one below first.</p>
        </div>
        
        <div class="space-y-4">
          <template x-for="(item, index) in $store.walletStore.localCosmJsWallets" :key="`${item.name}-${item.address}-${index}`">
            <div class="bg-background border border-border shadow-lg">
              <div class="p-4">
                <h3 class="font-semibold text-lg text-foreground" x-text="item.name"></h3>
                <p class="text-sm text-muted-foreground">
                  Address: <code class="text-xs bg-muted px-2 py-1 rounded font-mono" x-text="item.address"></code>
                </p>
                
                <!-- Local Wallet Status Message -->
                <div x-show="walletStatuses[item.name]" 
                     :class="walletStatuses[item.name]?.includes('Error') ? 'alert-destructive' : 'alert'"
                     class="mt-3">
                  <section x-text="walletStatuses[item.name]"></section>
                </div>
                
                <div class="mt-3">
                  <input
                    type="password"
                    :placeholder="`Password to unlock ${item.name}`"
                    x-model="passes[item.name]"
                    @input="clearWalletStatus(item.name)"
                    class="w-full px-3 py-2 bg-background border border-input rounded-md text-sm text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent"
                  />
                </div>
                
                <div class="flex justify-end gap-2 mt-4">
                  <!-- Connect -->
                  <button
                    :disabled="$store.walletStore.activeWalletMeta?.address === item.address"
                    @click="connectLocalWallet(item.name)"
                    class="btn"
                  >
                    Connect
                  </button>
                  <!-- Disconnect (only if currently connected) -->
                  <button
                    :disabled="$store.walletStore.activeWalletMeta?.address !== item.address"
                    @click="disconnectLocalWallet(item.name)"
                    class="btn"
                  >
                    Disconnect
                  </button>
                  <!-- Remove -->
                  <button
                    @click="removeLocalWallet(item.name)"
                    class="btn-destructive"
                  >
                    Remove...
                  </button>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>

  
    <!-- Import New Wallet Section -->
     <div class="">
    <h2 class="text-xl font-semibold text-foreground">Import New CosmJs Wallet</h2>
    <div class="bg-card border border-border rounded-lg shadow-lg">
      <div class="p-6">
        
        <!-- Import Status Message -->
        <div x-show="importStatus" 
             :class="importStatus.includes('Error') ? 'alert-destructive' : 'alert'"
             class="mb-4">
          <section x-text="importStatus"></section>
        </div>
        
        <div class="space-y-4">
          <div class="space-y-2">
            <label class="text-sm font-medium text-foreground">
              Wallet Name
            </label>
            <input 
              id="wallet-name-input"
              x-model="walletName" 
              @input="clearImportStatus()"
              placeholder="Name your wallet"
              class="w-full px-3 py-2 bg-background border border-input rounded-md text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent"
            />
          </div>
          
          <div class="space-y-2">
            <label class="text-sm font-medium text-foreground">
              Password
            </label>
            <input 
              id="wallet-password-input"
              type="password" 
              x-model="password" 
              @input="clearImportStatus()"
              placeholder="Password to encrypt wallet"
              class="w-full px-3 py-2 bg-background border border-input rounded-md text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent"
            />
          </div>
          
          <div class="space-y-2">
            <label class="text-sm font-medium text-foreground">
              Mnemonic
            </label>
            <textarea
              id="mnemonic-textarea"
              x-model="mnemonic"
              @change="mnemonicSaved = false; clearImportStatus()"
              rows="3"
              placeholder="Enter your mnemonic phrase..."
              class="w-full px-3 py-2 bg-background border border-input rounded-md text-foreground placeholder:text-muted-foreground font-mono text-sm focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent"
            ></textarea>
          </div>
          
          <div class="flex gap-2">
            <button
              @click="generateMnemonic12()"
              :disabled="mnemonic.trim().length > 0"
              class="btn-sm-outline"
            >
              Generate 12 words
            </button>
            <button
              @click="generateMnemonic24()"
              :disabled="mnemonic.trim().length > 0"
              class="btn-sm-outline"
            >
              Generate 24 words
            </button>
          </div>
          
          <div class="flex items-center space-x-2">
            <input 
              id="mnemonic-backup-checkbox"
              type="checkbox" 
              x-model="mnemonicSaved"
              class="w-4 h-4 text-primary bg-background border-border rounded focus:ring-primary focus:ring-2"
            />
            <label for="mnemonic-backup-checkbox" class="text-sm text-foreground cursor-pointer">I have backed up my mnemonic because I understand the risks.</label>
          </div>
          
          <div class="flex gap-2">
            <button
              id="import-wallet-btn"
              @click="importCosmJsWallet()"
              :disabled="!walletName || !password || !mnemonic || !mnemonicSaved"
              class="btn"
            >
              Import Wallet
            </button>
            <button 
              id="clear-mnemonic-btn"
              @click="mnemonic = ''; clearImportStatus()"
              class="btn"
            >
              Clear Mnemonic
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
    </div>
  </section> 
</div>
