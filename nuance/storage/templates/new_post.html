<div x-data="createNewPostData()">
  <h1 class="text-2xl font-bold p-4">Publish a New Post</h1>
  
  <div class="flex flex-col gap-4">
  <form id="postForm" action="post" target="#">
    <h2 class="text-center p-4">Content</h2>
      <textarea id="post-content" class="textarea" name="content" rows="10" x-model="content" x-on:input.debounce.500ms="updatePreview"></textarea>
    
  </form>
  </div>

  <div id="content">
    <h2 class="text-center pt-4">Preview</h2>

    <article id="article-preview" class="nuance">
      <header>
        <a href="#">Post #&infin;</a>
        by
        <a class="author" href="#" x-text="currentAuthor || 'Not connected'"></a>
        on
        <time x-text="new Date().toLocaleString()"></time>
        has earned 0 DYS |
        <a href="#">Topics</a>:
        <ol class="post-tag-list"><li>No tags found</li></ol>
      </header>
      <hr />
      <div class="markdown" x-ref="preview" x-html="previewHtml">
        <!-- Preview content will be rendered here -->
      </div>
    </article>

    <div x-show="currentAuthor" class="mb-4">
      <strong>Publishing as:</strong> <span x-text="currentAuthor"></span>
    </div>
    
    <div x-show="!hasAccount" class="mb-4" style="color: red;">
      Please connect your wallet to publish posts.
    </div>
    <!-- Error display -->
  <div x-show="error" class="error" style="color: red; background: #ffebee; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #ffcdd2;">
    <strong>Error:</strong> <span x-text="error"></span>
  </div>

    <button 
      type="button" 
      id="postButton" 
      class="btn"
      :disabled="!hasAccount || isSubmitting || !currentAuthor" 
      @click="postContent()"
      x-text="isSubmitting ? 'Posting...' : 'Post Content'"
    >
      Post Content
    </button>
    
  </div>
</div>
