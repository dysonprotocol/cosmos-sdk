<div x-data="createNewPostData()">
  <!-- Error display -->
  <div x-show="error" class="error" style="color: red; background: #ffebee; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #ffcdd2;">
    <strong>Error:</strong> <span x-text="error"></span>
  </div>

  <form id="postForm" action="post" target="#">
    <label>Content:
      <textarea id="post-content" class="" name="content" rows="10" x-model="content" x-on:input.debounce="updatePreview"></textarea>
    </label>
  </form>
  <h1>Preview</h1>
  <hr />

  <div id="content">
    <article id="article-preview" class="markdown" x-ref="preview" x-html="previewHtml">
      <!-- Preview will be rendered here -->
    </article>

    <label>Author Name (optional):
      <input id="author" class="" type="text" name="name" required x-model="author" />
    </label>
    <button 
      type="button" 
      id="postButton" 
      :disabled="!hasAccount || isSubmitting" 
      @click="postContent()"
      x-text="isSubmitting ? 'Posting...' : 'Post Content'"
    >
      Post Content
    </button>
  </div>
</div>
