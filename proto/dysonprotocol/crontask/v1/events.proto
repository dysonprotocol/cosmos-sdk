syntax = "proto3";
package dysonprotocol.crontask.v1;

option go_package = "dysonprotocol.com/x/crontask/types";

import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";

// EventTaskCreated is emitted when a new task is created
message EventTaskCreated {
  uint64 task_id = 1;
  string creator = 2;
}

// EventTaskPending is emitted when a task transitions to PENDING
message EventTaskPending {
  uint64 task_id = 1;
  string creator = 2;
}

// EventTaskDeleted is emitted when a task is deleted
message EventTaskDeleted {
  uint64 task_id = 1;
  string creator = 2;
}

// EventTaskExecuted is emitted when a task is executed
message EventTaskExecuted {
  uint64 task_id = 1;
  string creator = 2;
  string status = 3;
  bool success = 4;
}

// EventTaskExpired is emitted when a task expires without being executed
message EventTaskExpired {
  uint64 task_id = 1;
  string creator = 2;
}

// EventTaskFailed is emitted when a task finishes with failure
message EventTaskFailed {
  uint64 task_id = 1;
  string creator = 2;
  string error = 3;
}

// EventTaskPurged is emitted when a terminal task is removed by retention
// cleanup
message EventTaskPurged {
  uint64 task_id = 1;
  string status = 2;
  string creator = 3;
}

// EventCrontaskMetrics is emitted once per block with last-block metrics
// snapshot
message EventCrontaskMetrics {
  // executed totals
  uint64 executed_total_gas = 1;
  repeated cosmos.base.v1beta1.Coin executed_total_fees = 2
      [ (gogoproto.nullable) = false ];
  uint64 executed_task_count = 3;

  // pending snapshot at BeginBlock
  uint64 pending_task_count = 10;
  uint64 pending_gas_requested = 11;
  int64 pending_oldest_scheduled_ts = 12;
  // sum of task_gas_fee across all PENDING tasks at BeginBlock
  repeated cosmos.base.v1beta1.Coin pending_total_gas_fees = 13
      [ (gogoproto.nullable) = false ];
}