syntax = "proto3";
package dysonprotocol.storage.v1;

import "gogoproto/gogo.proto";

option go_package = "dysonprotocol.com/x/storage/types";

// Params defines the parameters for the storage module.
message Params {
  // max_storage_size defines the maximum storage size in bytes that can be
  // stored per owner
  uint64 max_storage_size = 1
      [ (gogoproto.moretags) = "yaml:\"max_storage_size\"" ];
}